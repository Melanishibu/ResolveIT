# Local development only. Tests use Testcontainers, not this file.
# Dev credentials only (resolveit/resolveit); never reuse them outside a developer machine.
services:
  postgres:
    image: postgres:17
    container_name: resolveit-postgres
    environment:
      POSTGRES_DB: resolveit
      POSTGRES_USER: resolveit
      POSTGRES_PASSWORD: resolveit
    ports:
      - "5432:5432"
    volumes:
      - resolveit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveit -d resolveit"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    container_name: resolveit-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  resolveit-postgres-data:
