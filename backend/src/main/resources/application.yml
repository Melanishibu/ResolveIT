# ResolveIT backend – base configuration.
# Every environment-specific value comes from an environment variable. Dev defaults live only in
# application-dev.yml; tests use application-test.yml and Testcontainers. No secrets in this file.
spring:
  application:
    name: resolveit
  datasource:
    url: ${RESOLVEIT_DB_URL}
    username: ${RESOLVEIT_DB_USERNAME}
    password: ${RESOLVEIT_DB_PASSWORD}
  flyway:
    # One PostgreSQL schema per bounded context. The Flyway history table lives in the first one.
    schemas: identity,incident
    create-schemas: true
  mail:
    # SMTP for transactional email (invitations, AB#48). Required outside dev/test.
    host: ${RESOLVEIT_SMTP_HOST}
    port: ${RESOLVEIT_SMTP_PORT:25}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

resolveit:
  # CORS: the only browser origin allowed to call the API (with cookies). Required outside dev/test.
  frontend-origin: ${FRONTEND_ORIGIN}
  # Where the frontend lives, for links in emails (set-password). Required outside dev/test.
  frontend-base-url: ${FRONTEND_BASE_URL}
  mail:
    # Sender of transactional emails. Required outside dev/test.
    from: ${RESOLVEIT_MAIL_FROM}
  session:
    # HS256 key for the session tokens: a random value of at least 32 characters. Required outside dev/test.
    signing-key: ${RESOLVEIT_SESSION_SIGNING_KEY:}
    lifetime: 8h

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Email is best-effort (a failed invitation becomes SEND_FAILED, AB#48): a mail outage must not mark the
      # backend DOWN.
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
