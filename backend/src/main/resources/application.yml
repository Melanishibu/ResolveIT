# ResolveIT backend – base configuration.
# Every environment-specific value comes from an environment variable. Dev defaults live only in
# application-dev.yml; tests use application-test.yml and Testcontainers. No secrets in this file.
spring:
  application:
    name: resolveit
  datasource:
    url: ${RESOLVEIT_DB_URL}
    username: ${RESOLVEIT_DB_USERNAME}
    password: ${RESOLVEIT_DB_PASSWORD}
  flyway:
    # One PostgreSQL schema per bounded context. The Flyway history table lives in the first one.
    schemas: identity,incident
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

resolveit:
  # CORS: the only browser origin allowed to call the API (with cookies). Required outside dev/test.
  frontend-origin: ${FRONTEND_ORIGIN}
  session:
    # HS256 key for the session tokens: a random value of at least 32 characters. Required outside dev/test.
    signing-key: ${RESOLVEIT_SESSION_SIGNING_KEY:}
    lifetime: 8h

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
